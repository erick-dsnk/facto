name: Claude Review
# One AI reviewer, blocking issues only (rules in REVIEW.md). It runs once when
# a PR opens or leaves draft, not on every push, to keep the noise down.
# Comment "@claude review" to re-run it on demand (handled by claude.yml).
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent-opened PRs come from bot accounts, which the action refuses by
          # default. claude[bot] is verified; the Copilot and Codex names are
          # their usual PR authors (unverified here).
          allowed_bots: "claude[bot],Copilot,chatgpt-codex-connector[bot]"
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            Follow REVIEW.md: blocking issues only, max 5 findings.
          # The inline-comment tool must be allowed, or comments won't post.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
