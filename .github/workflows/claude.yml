name: Claude
# Claude works an issue or PR when you:
#   - comment "@claude ..." on an issue or PR (only users with write access)
#   - add the `claude` label to an issue
#   - assign the issue to the user set in assignee_trigger (optional)
# The workflow does not pass github_token, so the Claude GitHub App opens the PRs
# and CI runs on them. Install the app with `/install-github-app` in Claude Code.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (
        (github.event.action == 'labeled' && github.event.label.name == 'claude') ||
        github.event.action == 'assigned' ||
        contains(github.event.issue.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription token from `claude setup-token`. To bill the API
          # instead, swap in: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          # assignee_trigger: claude-bot
          branch_prefix: claude/
          track_progress: true
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
