<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=600, height=600, initial-scale=1.0"/>
    <meta name="description" content="Actually glasses prototype: claim capture, searching and source-backed result cards."/>
    <meta name="mrbd-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#000000"/>
    <link rel="icon" type="image/png" href="/favicon.png"/>
    <title>Actually — Display</title>
    <script>
      // The wearable route has a fixed device viewport; only the developer shell is responsive.
      if (new URLSearchParams(location.search).get('display') !== '1' && new URLSearchParams(location.search).get('inspect') !== '1' && new URLSearchParams(location.search).get('live') !== '1') {
        document.querySelector('meta[name="viewport"]').content = 'width=device-width, initial-scale=1.0';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
