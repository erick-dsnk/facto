name: GlassesLab
options:
  bundleIdPrefix: com.davidvasilescu.junction
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  # Downloads the wake phrase libraries on the first run (about 47 MB), then does nothing.
  preGenCommand: scripts/fetch-wake-word-libs.sh

packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

settings:
  base:
    DEVELOPMENT_TEAM: 97JCVP9322
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Developer Mode skips attestation when MetaAppID is 0, so no credentials are needed yet.
    META_APP_ID: "0"
    CLIENT_TOKEN: ""

targets:
  GlassesLab:
    type: application
    platform: iOS
    sources:
      - path: GlassesLab
        excludes:
          # Placeholder files that keep empty module folders in git.
          - "**/.keep"
          # Added back below as plain resources, so the font lands at the bundle root.
          - "Resources/Fonts/**"
      - path: GlassesLab/Resources/Fonts
        buildPhase: resources
    scheme:
      testTargets:
        - GlassesLabTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidvasilescu.junction.glasseslab
        CODE_SIGN_ENTITLEMENTS: GlassesLab/GlassesLab.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
      # Swipes and back from Meta Ray-Ban Display glasses dismiss the lens (experimental in 1.0).
      - package: MWDAT
        product: MWDATInputs
      - package: MWDAT
        product: MWDATMockDevice
      # On-device keyword spotter for the "Hey Facto" wake phrase (issue #53), static libraries
      # fetched into Vendor/ by scripts/fetch-wake-word-libs.sh. They make no network calls.
      - framework: Vendor/sherpa-onnx.xcframework
        embed: false
      - framework: Vendor/onnxruntime.xcframework
        embed: false
      - sdk: libc++.tbd
    info:
      path: GlassesLab/Info.plist
      properties:
        CFBundleDisplayName: Facto
        # Onest (SIL OFL 1.1), the website's font. Licence: Resources/Fonts/Onest-OFL.txt.
        UIAppFonts: [Onest-Variable.ttf]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [glasseslab]
        MWDAT:
          AppLinkURLScheme: "glasseslab://"
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        # No External Accessory keys on purpose: with them the SDK streams over
        # Bluetooth Classic (low bitrate). Without them it streams over the glasses'
        # Wi-Fi link (720x1280 @ 30 fps). Meta: github.com/meta/meta-wearables-dat-ios/issues/376
        UIBackgroundModes:
          # Keeps the on-device wake phrase detector running with the phone locked.
          - audio
          - processing
          - bluetooth-central
          - bluetooth-peripheral
        NSBluetoothAlwaysUsageDescription: Facto connects to your Meta glasses over Bluetooth.
        NSLocalNetworkUsageDescription: Facto finds your glasses on Wi-Fi to use their camera and mic.
        NSBonjourServices: [_bonjour._tcp]
        NSCameraUsageDescription: Simulated glasses use the phone camera as their video feed.
        NSMicrophoneUsageDescription: Facto listens through the glasses mic during an audio check, and on this phone for Hey Facto when you turn that on.

  GlassesLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GlassesLabTests
        excludes:
          - "Fixtures/**"
      # Folder reference: the JSON files land in the test bundle under Fixtures/.
      - path: GlassesLabTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: GlassesLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidvasilescu.junction.glasseslab.tests
        GENERATE_INFOPLIST_FILE: YES
